services:
  postgres:
    image: postgres:16-alpine
    container_name: sava-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sava
    ports:
      - "5432:5432"
    volumes:
      - sava_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sava"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sava-laravel
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sava
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_REDIRECT_URI: ${AZURE_REDIRECT_URI:-http://localhost:8000/auth/microsoft/callback}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor

volumes:
  sava_pg_data:
  vendor_data:
